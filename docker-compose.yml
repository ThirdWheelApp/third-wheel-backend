version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-claude-haiku-4-5-20251001}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.7}
      - MAX_TOKENS=${MAX_TOKENS:-1024}
      - MAX_AGENT_TURNS=${MAX_AGENT_TURNS:-3}
      - MAX_PRIVATE_AGENT_QUERIES=${MAX_PRIVATE_AGENT_QUERIES:-3}
      - SESSION_TIMEOUT_MINUTES=${SESSION_TIMEOUT_MINUTES:-30}
      - CHECKIN_APPROVAL_TIMEOUT_DAYS=${CHECKIN_APPROVAL_TIMEOUT_DAYS:-7}
      - MAX_CONTEXTS_PER_LOAD=${MAX_CONTEXTS_PER_LOAD:-50}
      - SECRET_LEVEL_THRESHOLD=${SECRET_LEVEL_THRESHOLD:-5}
      - ENVIRONMENT=${ENVIRONMENT:-development}
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
